name: Deploy SONOUNAMETO (sonounameto.aymart.bj)

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  NODE_VERSION: "18"
  DOMAIN: sonounameto.aymart.bj
  # Le compte FTP est déjà chrooté dans le dossier du site → racine "/"
  REMOTE_DIR: /

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "Linting warnings (continuing...)"

      - name: Type checking
        run: npm run type-check || echo "Type check warnings (continuing...)"

      - name: Build for production
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build:simple

      - name: Verify deployment files
        run: |
          echo "=== Contenu deploy/ (racine) ==="
          ls -la deploy/ | head -30
          echo ""
          echo "=== Taille ==="
          du -sh deploy/
          echo ""
          if [ -d "deploy/node_modules" ]; then
            echo "❌ ERREUR : node_modules présent dans deploy/"
            exit 1
          fi
          echo "✓ Aucun node_modules — OK pour FTP"

      - name: Deploy to cPanel via FTP
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.CPANEL_SERVER }}
          user: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PWD }}
          local_dir: ./deploy
          remote_dir: ${{ env.REMOTE_DIR }}
          delete: "false"
          max_retries: "3"
          ftp_ssl_allow: "false"
          ftp_use_feat: "true"

      - name: Deployment success
        run: |
          echo "Déploiement FTP terminé : https://${{ env.DOMAIN }}"
          echo ""
          echo "Étape manuelle sur cPanel (après chaque déploiement) :"
          echo "  1. Setup Node.js App → Run NPM Install"
          echo "  2. Restart l'application (startup: server.js)"
          echo ""
          echo "node_modules n'est PAS envoyé par FTP — il est créé sur le serveur."
