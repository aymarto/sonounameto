name: Deploy SONOUNAMETO (galerienounameto.aymart.bj)

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  NODE_VERSION: "18"
  DOMAIN: galerienounameto.aymart.bj
  # Le compte FTP est déjà chrooté dans le dossier du site → racine "/"
  REMOTE_DIR: /

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "Linting warnings (continuing...)"

      - name: Type checking
        run: npm run type-check || echo "Type check warnings (continuing...)"

      - name: Write build version (cache bust)
        run: node scripts/write-version.js

      - name: Build for production
        run: npm run build:simple

      - name: Verify deployment files
        run: |
          echo "=== Contenu deploy/ (racine) ==="
          ls -la deploy/ | head -30
          echo ""
          echo "=== Taille ==="
          du -sh deploy/
          echo ""
          if [ -d "deploy/node_modules" ]; then
            echo "❌ ERREUR : node_modules présent dans deploy/"
            exit 1
          fi
          echo "✓ Aucun node_modules — OK pour FTP"

      - name: Deploy to cPanel via FTP
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.CPANEL_SERVER }}
          user: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PWD }}
          local_dir: ./deploy
          remote_dir: ${{ env.REMOTE_DIR }}
          # false = ne pas supprimer le .htaccess Passenger généré par cPanel (sinon 403)
          delete: "false"
          max_retries: "3"
          ftp_ssl_allow: "false"
          ftp_use_feat: "true"

      - name: Deployment success
        run: |
          echo "Déploiement FTP terminé : https://${{ env.DOMAIN }}"
          echo ""
          echo "Étape manuelle sur cPanel (OBLIGATOIRE après chaque déploiement) :"
          echo "  1. Vérifier les variables NEXT_PUBLIC_FIREBASE_* dans Setup Node.js App"
          echo "  2. Run NPM Install"
          echo "  3. Restart l'application (startup: server.js)"
          echo "  4. LiteSpeed → Purge All (vider le cache)"
          echo ""
          echo "Si le site affiche 403 : supprimer public/.htaccess sur le serveur (ne pas le remettre)."
          echo "node_modules n'est PAS envoyé par FTP — il est créé sur le serveur."

      - name: Smoke test (site accessible)
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.DOMAIN }}/" || echo "000")
          echo "HTTP $code pour https://${{ env.DOMAIN }}/"
          if [ "$code" = "403" ]; then
            echo "::warning::403 détecté — supprimez public/.htaccess sur le serveur et redémarrez Node."
          fi
